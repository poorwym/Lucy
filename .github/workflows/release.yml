name: Release

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/poorwym/lucy
  RUST_VERSION: 1.94.1

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      next_version: ${{ steps.version.outputs.next_version }}
      revision: ${{ steps.version.outputs.revision }}
      publish: ${{ steps.version.outputs.publish }}
      needs_bump: ${{ steps.version.outputs.needs_bump }}

    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustup override set "$RUST_VERSION"

      - name: Determine release version
        id: version
        env:
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail

          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output '.packages[] | select(.name == "lucy") | .version'
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Workspace version must be a stable SemVer, got '${version}'"
            exit 1
          fi

          IFS=. read -r major minor patch <<<"$version"
          next_version="${major}.${minor}.$((patch + 1))"
          latest_tag="$(
            git tag --list 'v*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"

          publish=true
          needs_bump=true
          if [[ -n "$latest_tag" ]] &&
             git merge-base --is-ancestor "$SOURCE_SHA" "${latest_tag}^{commit}"; then
            publish=false
            if [[ "$latest_tag" != "v${version}" ]]; then
              needs_bump=false
            fi
          elif git rev-parse --verify --quiet "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} already exists but does not contain ${SOURCE_SHA}; the workspace version was not advanced"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "next_version=${next_version}"
            echo "revision=$(git rev-parse HEAD)"
            echo "publish=${publish}"
            echo "needs_bump=${needs_bump}"
          } >>"$GITHUB_OUTPUT"

      - name: Run workspace tests
        if: steps.version.outputs.publish == 'true'
        run: cargo test --workspace --locked

  standalone:
    name: Standalone ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            deployment_target: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            deployment_target: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            deployment_target: "10.12"
          - runner: macos-14
            target: aarch64-apple-darwin
            deployment_target: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}

      - name: Select Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --no-self-update \
            --target "${{ matrix.target }}"
          rustup override set "$RUST_VERSION"

      - name: Build Lucy
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" -p lucy

      - name: Inspect native dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/lucy"
          file "$binary"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ldd "$binary"
          else
            otool -L "$binary"
          fi

      - name: Verify standalone routes
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/release-smoke.sh \
            "target/${TARGET}/release/lucy" \
            "$VERSION" \
            config/lucy.example.yaml

      - name: Package standalone archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/package-release.sh \
            "$VERSION" \
            "$TARGET" \
            "target/${TARGET}/release/lucy" \
            dist

      - name: Upload standalone archive
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: standalone-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - standalone
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0

      - name: Download standalone archives
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Verify release archives and checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )

          for target in "${targets[@]}"; do
            archive="release-assets/lucy-v${VERSION}-${target}.tar.gz"
            checksum="${archive}.sha256"
            root="lucy-v${VERSION}-${target}"

            test -f "$archive"
            test -f "$checksum"
            tar -tzf "$archive" "$root/lucy" >/dev/null
            tar -tzf "$archive" "$root/LICENSE" >/dev/null
            tar -tzf "$archive" "$root/README.md" >/dev/null
            tar -tzf "$archive" "$root/lucy.example.yaml" >/dev/null

            if tar -tzf "$archive" | grep -Eq '(^|/)(frontend|Cesium)(/|$)'; then
              echo "::error::$archive contains frontend assets"
              exit 1
            fi
          done

          cat release-assets/*.sha256 |
            sort --key=2 >release-assets/SHA256SUMS
          (
            cd release-assets
            sha256sum --check SHA256SUMS
          )

          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(wc -l <release-assets/SHA256SUMS)" -eq 4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/lucy/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.revision }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          cache-from: type=gha,scope=lucy-release
          cache-to: type=gha,scope=lucy-release,mode=min,ignore-error=true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail

          gh release create "v${VERSION}" \
            release-assets/*.tar.gz \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REVISION" \
            --title "Lucy v${VERSION}" \
            --generate-notes

          test "$(
            gh release view "v${VERSION}" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets | length'
          )" -eq 5

      - name: Prepare next patch version
        if: needs.prepare.outputs.needs_bump == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next_version }}
        run: |
          set -euo pipefail

          git fetch origin main
          git switch --force-create release-version-bump origin/main

          remote_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq --raw-output '.packages[] | select(.name == "lucy") | .version'
          )"
          if [[ "$remote_version" == "$NEXT_VERSION" ]]; then
            echo "main already targets v${NEXT_VERSION}"
            exit 0
          fi
          if [[ "$remote_version" != "$VERSION" ]]; then
            echo "::error::Expected main at v${VERSION} or v${NEXT_VERSION}, got v${remote_version}"
            exit 1
          fi

          python3 - "$VERSION" "$NEXT_VERSION" <<'PY'
          from pathlib import Path
          import re
          import sys

          current, next_version = sys.argv[1:]
          path = Path("Cargo.toml")
          lines = path.read_text().splitlines(keepends=True)
          in_workspace_package = False
          replacements = 0

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped == "[workspace.package]":
                  in_workspace_package = True
                  continue
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_workspace_package = False
              if in_workspace_package and re.fullmatch(
                  rf'version\s*=\s*"{re.escape(current)}"\s*', stripped
              ):
                  newline = "\n" if line.endswith("\n") else ""
                  lines[index] = f'version = "{next_version}"{newline}'
                  replacements += 1

          if replacements != 1:
              raise SystemExit(
                  f"expected one workspace version {current}, replaced {replacements}"
              )
          path.write_text("".join(lines))
          PY

          cargo check --workspace
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): prepare v${NEXT_VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
