# Catalog for the deterministic SQL fixtures loaded by `just load-fixtures`
# plus the locally imported 3DBAG benchmark source. Tests should prefer
# source-scoped URLs.
default_source: poc_buildings
validation:
  startup: metadata
sources:
  poc_buildings:
    connection: ${DATABASE_URL}
    schema: public
    table: poc_buildings
    geometry_column: geom
    id_column: id
    srid: 4326
    source_model: extruded_footprint
    base_height_column: base_height_m
    height_column: height_m
    geometry_types:
      - Polygon
      - MultiPolygon
    bounds:
      west: -122.40130
      south: 37.79245
      east: -122.39975
      north: 37.79375
      min_height_m: 0.0
      max_height_m: 100.0
    min_level: 0
    max_level: 2
    subtree_levels: 4
    max_features_per_tile: 1000
    tileset:
      root_geometric_error_m: 512.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - name
      - building_type
      - base_height_m
      - height_m
    material:
      color_column: color
      default_base_color: [0.72, 0.70, 0.65, 1.0]
  surface_buildings_7415:
    connection: ${DATABASE_URL}
    schema: public
    table: surface_buildings_7415
    geometry_column: geom
    id_column: id
    srid: 7415
    source_model: surface_geometry_z
    coordinate_operation: rdnaptrans2018_epsg_1149
    geometry_types:
      - PolygonZ
      - MultiPolygonZ
    # Target EPSG:4979 region and ellipsoidal heights. The explicit operation
    # includes the EPSG:1149 ETRS89-to-WGS84 zero-translation approximation.
    bounds:
      west: 5.84970
      south: 50.83985
      east: 5.85071
      north: 50.84021
      min_height_m: 170.0
      max_height_m: 201.0
    min_level: 0
    # Native XYZ faces are clipped in a stable source frame for each tile.
    max_level: 2
    subtree_levels: 4
    max_features_per_tile: 100
    tileset:
      root_geometric_error_m: 128.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - identificatie
      - name
      - surface_kind
    material:
      color_column: color
      default_base_color: [0.72, 0.70, 0.65, 1.0]
  nl_lod12_3d:
    connection: ${DATABASE_URL}
    schema: public
    # The 99 source features previously rejected by Lucy's surface contract
    # were repaired in place; backup and audit tables remain in PostGIS.
    table: nl_lod12_3d
    geometry_column: geom
    id_column: fid
    srid: 7415
    source_model: surface_geometry_z
    # All rows were audited through Lucy's surface decode/mesh contract when
    # the 99 rejected source features above were repaired. Re-audit before
    # keeping this shortcut enabled after replacing or mutating source rows.
    surface_subtree_envelope_shortcut: true
    coordinate_operation: rdnaptrans2018_epsg_1149
    geometry_types:
      - MultiPolygonZ
    bounds:
      west: 4.6050787
      south: 52.1887155
      east: 5.1391789
      north: 52.5113376
      min_height_m: 31.47
      max_height_m: 218.75
    min_level: 0
    max_level: 7
    subtree_levels: 2
    max_features_per_tile: 1000
    tileset:
      content_start_level: 3
      root_geometric_error_m: 2000.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - identificatie
    material:
      default_base_color: [0.72, 0.70, 0.65, 1.0]
  helsinki_kalasatama_lod2:
    connection: ${DATABASE_URL}
    schema: public
    table: helsinki_kalasatama_lod2
    geometry_column: geom
    id_column: gml_id
    # Import normalizes ETRS-GK25 + N2000 height to WGS 84 longitude,
    # latitude, and ellipsoidal height with the FIN2023N2000 geoid grid.
    srid: 4979
    source_model: surface_geometry_z
    # The pinned import passed Lucy full validation and every available GLB was
    # materialized, exercising decode, planarity, topology, triangulation, and
    # clipping. Repeat both checks before keeping this after replacing the table.
    surface_subtree_envelope_shortcut: true
    geometry_types:
      - MultiPolygonZ
    bounds:
      west: 24.9487997
      south: 60.1648910
      east: 25.0052481
      north: 60.2045649
      min_height_m: 5.51
      max_height_m: 154.12
    min_level: 0
    max_level: 7
    subtree_levels: 2
    max_features_per_tile: 1000
    tileset:
      content_start_level: 3
      root_geometric_error_m: 1000.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - measured_height_m
      - roof_type
      - creation_date
      - source_polygon_count
      - source_vertex_count
      - polygon_count
    material:
      default_base_color: [0.76, 0.72, 0.65, 1.0]
