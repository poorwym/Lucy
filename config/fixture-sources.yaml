# Self-contained catalog for the deterministic SQL fixtures loaded by
# `just load-fixtures`. Tests should prefer source-scoped URLs.
default_source: poc_buildings
sources:
  poc_buildings:
    connection: ${DATABASE_URL}
    schema: public
    table: poc_buildings
    geometry_column: geom
    id_column: id
    srid: 4326
    source_model: extruded_footprint
    vertical_reference: local_ground_meters
    base_height_column: base_height_m
    height_column: height_m
    geometry_types:
      - Polygon
      - MultiPolygon
    bounds:
      west: -122.40130
      south: 37.79245
      east: -122.39975
      north: 37.79375
      min_height_m: 0.0
      max_height_m: 100.0
    min_level: 0
    max_level: 16
    subtree_levels: 4
    max_features_per_tile: 1000
    tileset:
      root_geometric_error_m: 512.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - name
      - building_type
      - base_height_m
      - height_m
    material:
      color_column: color
      default_base_color: [0.72, 0.70, 0.65, 1.0]
  surface_buildings_7415:
    connection: ${DATABASE_URL}
    schema: public
    table: surface_buildings_7415
    geometry_column: geom
    id_column: id
    srid: 7415
    source_model: surface_geometry_z
    vertical_reference:
      crs: EPSG:7415
      target: EPSG:4979
      operation: rdnaptrans2018_epsg_1149
    geometry_types:
      - PolygonZ
      - MultiPolygonZ
    # Target EPSG:4979 region and ellipsoidal heights. The explicit operation
    # includes the EPSG:1149 ETRS89-to-WGS84 zero-translation approximation.
    bounds:
      west: 5.84970
      south: 50.83985
      east: 5.85071
      north: 50.84021
      min_height_m: 170.0
      max_height_m: 201.0
    min_level: 0
    # Whole PolygonZ faces are root-owned until a 3D-safe subdivision policy
    # can preserve both tile containment and vertical surfaces.
    max_level: 0
    subtree_levels: 4
    max_features_per_tile: 100
    tileset:
      root_geometric_error_m: 128.0
      content_uri_template: "content/{level}/{x}/{y}.glb"
      subtree_uri_template: "subtrees/{level}/{x}/{y}.subtree"
    attributes:
      - identificatie
      - name
      - surface_kind
    material:
      color_column: color
      default_base_color: [0.72, 0.70, 0.65, 1.0]
